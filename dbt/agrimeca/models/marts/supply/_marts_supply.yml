version: 2

models:
  - name: dim_plant
    description: Dimension des usines, une ligne par plant_code, nom le plus récemment connu.
    columns:
      - name: plant_code
        data_tests:
          - not_null
          - unique
      - name: plant_name
        description: Nom de l'usine, tel que porté par la commande d'achat la plus récente.
        data_tests:
          - not_null
  - name: dim_supplier
    description: Dimension des fournisseurs, une ligne par supplier_id, nom le plus récemment connu.
    columns:
      - name: supplier_id
        data_tests:
          - not_null
          - unique
      - name : country_name
        description: Nom du pays du fournisser selon l'interpretation  du code pays
        data_tests:
          - not_null
      - name: region
        description: Région du fournisseur selon le pays (Europe, Amérique, Asie, …)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Zone euro', 'Amérique', 'Asie', 'Europe hors zone euro']
  - name: dim_date
    description: "Une ligne ligne par jour, de la première date de commande jusqu'à aujourd'hui + 1 an"
    columns: 
      - name: date_day
        description: "Jour clé de la dimensin date"
        data_tests:
          - not_null
          - unique
      - name: day_of_week
        description: "Numéro du jour de la semaine (1 = lundi … 7 = dimanche)"
        data_tests:
            - accepted_values:
                arguments:
                  values: [1, 2, 3, 4, 5, 6, 7]

